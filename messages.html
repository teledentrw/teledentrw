<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Consultation Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#eef3f8;
height:100vh;
display:flex;
flex-direction:column;
}

.chat-header{

background:#0a4d8c;
color:white;

padding:15px 20px;

display:flex;
justify-content:space-between;
align-items:center;

}

.chat-header h2{
font-size:20px;
}

.status{
font-size:13px;
opacity:.8;
}

.chat-container{

flex:1;

display:flex;
flex-direction:column;

max-width:1200px;

width:100%;

margin:auto;

background:white;

box-shadow:
0 2px 15px rgba(0,0,0,.08);

}

.messages{

flex:1;

overflow-y:auto;

padding:20px;

background:
#f5f9fc;

}

.message{

max-width:65%;

padding:12px;

margin-bottom:10px;

border-radius:15px;

word-wrap:break-word;

}

.sent{

background:#0a4d8c;

color:white;

margin-left:auto;

border-bottom-right-radius:4px;

}

.received{

background:white;

border:1px solid #ddd;

border-bottom-left-radius:4px;

}

.sender{

font-size:12px;
font-weight:bold;

margin-bottom:6px;

}

.message-form{

display:flex;

gap:10px;

padding:15px;

background:white;

border-top:1px solid #ddd;

}

.message-form input{

flex:1;

padding:14px;

border:1px solid #ccc;

border-radius:30px;

}

.message-form button{

background:#25c26e;

color:white;

border:none;

padding:14px 25px;

border-radius:30px;

cursor:pointer;

}

@media(max-width:768px){

.message{

max-width:90%;

}

}

</style>

</head>

<body>

<div class="chat-header">

<div>

<h2>
💬 TeleDent Chat
</h2>

<div class="status">

Patient ↔ Dentist Consultation

</div>

</div>

<a
href="dentist.html"
style="
color:white;
text-decoration:none;
">

⬅ Back

</a>

</div>

<div class="chat-container">

<div
class="messages"
id="chat">

</div>

<div class="message-form">

<input
id="message"
placeholder="Type your message...">

<button
onclick="sendMessage()">

Send

</button>

</div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

const user =
JSON.parse(
localStorage.getItem("user")
);

const params =
new URLSearchParams(
location.search
);

const consultationId =
params.get("consultation") || 1;

async function loadMessages(){

const res =
await fetch(
API +
"/messages/" +
consultationId
);

const data =
await res.json();

chat.innerHTML = "";

data.forEach(msg=>{

const sent =
msg.sender_id ==
user.id;

chat.innerHTML += `

<div class="
message
${sent
? 'sent'
: 'received'}
">

<div class="sender">

${sent
? 'You'
: 'Healthcare Provider'}

</div>

${msg.message}

</div>

`;

});

chat.scrollTop =
chat.scrollHeight;

}

async function sendMessage(){

if(
message.value.trim() === ""
)
return;

await fetch(
API +
"/send-message",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

consultation_id:
consultationId,

sender_id:
user.id,

message:
message.value

})
}
);

message.value = "";

loadMessages();

}

loadMessages();

setInterval(
loadMessages,
3000
);

</script>

</body>

</html>
