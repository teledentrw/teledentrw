<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Find a Dentist</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f9fc;
}

.container{
max-width:1300px;
margin:auto;
padding:25px;
}

.header{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:25px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(320px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.profile-photo{

width:100px;
height:100px;

border-radius:50%;

object-fit:cover;

border:3px solid #0a4d8c;

margin-bottom:15px;

}

.avatar{

width:100px;
height:100px;

background:#0a4d8c;
color:white;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:34px;

margin-bottom:15px;

}

.badge{

display:inline-block;

padding:6px 12px;

background:#eafaf1;

color:#25c26e;

border-radius:30px;

font-size:13px;

margin-top:10px;

}

</style>

<link
rel="stylesheet"
href="mobile.css">

</head>

<body>
    <button
id="menuBtn">

☰

</button>

<div class="container">

<div class="header">

<h1>
🦷 Our Dentists
</h1>

<p>
Connect with licensed dental professionals.
</p>

</div>

<div id="dentists" class="grid"></div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

async function loadDentists(){

const res =
await fetch(
API + "/dentists"
);

const data =
await res.json();

dentists.innerHTML = "";

data.forEach(dentist=>{

dentists.innerHTML += `

<div class="card">

${
dentist.profile_photo

?

`

<img
src="${dentist.profile_photo}"
class="profile-photo">

`

:

`

<div class="avatar">

${dentist.fullname
.charAt(0)
.toUpperCase()}

</div>

`

}

<h2>

${dentist.fullname}

</h2>

<div class="badge">

${dentist.speciality ||
"General Dentistry"}

</div>

<br><br>

<p>

<b>Experience:</b>

${dentist.experience ||
"Not Provided"}

Years

</p>

<p>

<b>Clinic:</b>

${dentist.clinic_name ||
"TeleDent Rwanda"}

</p>

<p>

<b>License:</b>

${dentist.license_number ||
"Not Provided"}

</p>

</div>

`;

});

}

loadDentists();

</script>

<script src="ai-widget.js"></script>

<script>

const menuBtn =
document.getElementById(
"menuBtn"
);

const sidebar =
document.querySelector(
".sidebar"
);

if(
menuBtn &&
sidebar
){

menuBtn.onclick = ()=>{

sidebar.classList.toggle(
"active"
);

};

}

</script>
</body>

</html>
