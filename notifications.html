<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
TeleDent Notifications
</title>

<link rel="stylesheet" href="mobile.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f8fc;
}

.header{

background:
linear-gradient(
135deg,
#0a4d8c,
#1976d2
);

color:white;

padding:25px;

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

}

.header h1{

font-size:32px;

}

.btn{

background:white;

color:#0a4d8c;

padding:12px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.container{

max-width:1300px;

margin:auto;

padding:25px;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:25px;

}

.stat-card{

background:white;

padding:20px;

border-radius:15px;

box-shadow:
0 5px 15px rgba(0,0,0,.05);

}

.stat-card h3{

color:#0a4d8c;

margin-bottom:10px;

}

.stat-number{

font-size:36px;

font-weight:bold;

color:#1976d2;

}

.filters{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:25px;

}

.filters button{

border:none;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

}

.active-filter{

background:#0a4d8c;

color:white;

}

.notification{

background:white;

padding:20px;

margin-bottom:15px;

border-radius:15px;

box-shadow:
0 5px 15px rgba(0,0,0,.05);

display:flex;

justify-content:space-between;

align-items:center;

gap:15px;

}

.notification-content{

flex:1;

}

.notification-title{

font-size:18px;

font-weight:bold;

margin-bottom:8px;

}

.notification-message{

color:#555;

line-height:1.6;

}

.notification-time{

font-size:12px;

color:#888;

margin-top:8px;

}

.badge{

padding:8px 12px;

border-radius:20px;

font-size:12px;

font-weight:bold;

white-space:nowrap;

}

.unread{

background:#ffe4e4;

color:#d90000;

}

.read{

background:#e8f7ee;

color:#25c26e;

}

.appointment{

border-left:5px solid #1976d2;

}

.message{

border-left:5px solid #25c26e;

}

.payment{

border-left:5px solid #ff9800;

}

.ai{

border-left:5px solid #7b1fa2;

}

.empty{

text-align:center;

padding:40px;

background:white;

border-radius:15px;

}

@media(max-width:768px){

.notification{

flex-direction:column;

align-items:flex-start;

}

.notification .badge{

align-self:flex-end;

}

.header{

text-align:center;

justify-content:center;

gap:15px;

}

}

</style>

</head>

<body>

<div class="header">

<div>

<h1>

🔔 Notifications

</h1>

<p>

Stay updated with your oral health journey

</p>

</div>

<a href="patient.html">

<button class="btn">

← Dashboard

</button>

</a>

</div>

<div class="container">

<div class="stats">

<div class="stat-card">

<h3>
Unread
</h3>

<div
id="unreadCount"
class="stat-number">

0

</div>

</div>

<div class="stat-card">

<h3>
Messages
</h3>

<div
id="messageCount"
class="stat-number">

0

</div>

</div>

<div class="stat-card">

<h3>
Appointments
</h3>

<div
id="appointmentCount"
class="stat-number">

0

</div>

</div>

<div class="stat-card">

<h3>
AI Alerts
</h3>

<div
id="aiCount"
class="stat-number">

0

</div>

</div>

</div>

<div class="filters">

<button
class="active-filter"
onclick="filterNotifications('all')">

All

</button>

<button
onclick="filterNotifications('appointment')">

Appointments

</button>

<button
onclick="filterNotifications('message')">

Messages

</button>

<button
onclick="filterNotifications('payment')">

Payments

</button>

<button
onclick="filterNotifications('ai')">

AI Coach

</button>

</div>

<div id="notificationList">

</div>

</div>

<script>

const notifications = [

{
type:"appointment",
title:"📅 Appointment Reminder",
message:"Your dental appointment is scheduled for tomorrow at 10:00 AM.",
time:"2 hours ago",
status:"unread"
},

{
type:"message",
title:"💬 Dentist Reply",
message:"Your dentist reviewed your consultation and provided recommendations.",
time:"4 hours ago",
status:"unread"
},

{
type:"payment",
title:"💳 Payment Reminder",
message:"A consultation payment is pending.",
time:"Yesterday",
status:"read"
},

{
type:"ai",
title:"🤖 AI Health Coach",
message:"Remember to brush twice daily and reduce sugary snacks.",
time:"Today",
status:"read"
}

];

function renderNotifications(type="all"){

const filtered =
type === "all"

?

notifications

:

notifications.filter(
n => n.type === type
);

document.getElementById(
"notificationList"
).innerHTML =

filtered.length

?

filtered.map(n=>`

<div class="notification ${n.type}">

<div class="notification-content">

<div class="notification-title">

${n.title}

</div>

<div class="notification-message">

${n.message}

</div>

<div class="notification-time">

${n.time}

</div>

</div>

<div>

<span class="badge ${n.status}">

${n.status}

</span>

</div>

</div>

`).join("")

:

`

<div class="empty">

No notifications found.

</div>

`;

}

function filterNotifications(type){

renderNotifications(type);

}

document.getElementById(
"unreadCount"
).innerHTML =

notifications.filter(
n => n.status === "unread"
).length;

document.getElementById(
"messageCount"
).innerHTML =

notifications.filter(
n => n.type === "message"
).length;

document.getElementById(
"appointmentCount"
).innerHTML =

notifications.filter(
n => n.type === "appointment"
).length;

document.getElementById(
"aiCount"
).innerHTML =

notifications.filter(
n => n.type === "ai"
).length;

renderNotifications();

</script>

</body>

</html>
