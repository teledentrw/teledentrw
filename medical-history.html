<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Medical History</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f9fc;
}

.container{
max-width:1300px;
margin:auto;
padding:25px;
}

.header{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:20px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.big-number{
font-size:34px;
font-weight:bold;
color:#0a4d8c;
margin-top:10px;
}

.history-card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
margin-top:10px;
}

.pending{
background:#fff4de;
color:#ff9800;
}

.review{
background:#eaf6ff;
color:#0a4d8c;
}

.completed{
background:#eafaf1;
color:#25c26e;
}

.paid{
background:#eafaf1;
color:#25c26e;
}

.unpaid{
background:#ffe8e8;
color:#f44336;
}

.actions{
margin-top:15px;
}

.btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-right:8px;
}

.primary{
background:#0a4d8c;
color:white;
}

.success{
background:#25c26e;
color:white;
}

.photo{
margin-top:15px;
max-width:220px;
border-radius:10px;
border:1px solid #ddd;
}

.empty{
background:white;
padding:40px;
text-align:center;
border-radius:12px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
📁 Medical History
</h1>

<p>

View consultation records,
diagnoses, payments, dental photos
and treatment history.

</p>

</div>

<div class="stats">

<div class="stat-card">

<h3>
🦷 Total Consultations
</h3>

<div
class="big-number"
id="totalCases">

0

</div>

</div>

<div class="stat-card">

<h3>
✅ Completed Cases
</h3>

<div
class="big-number"
id="completedCases">

0

</div>

</div>

<div class="stat-card">

<h3>
💳 Paid Consultations
</h3>

<div
class="big-number"
id="paidCases">

0

</div>

</div>

</div>

<div id="history"></div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

const user =
JSON.parse(
localStorage.getItem("user")
);

if(
!user ||
user.role !== "patient"
){

location = "login.html";

}

async function loadHistory(){

const res =
await fetch(
API + "/my-consultations",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
patient_id:user.id
})
}
);

const consultations =
await res.json();

totalCases.innerHTML =
consultations.length;

completedCases.innerHTML =
consultations.filter(
c => c.status === "Completed"
).length;

paidCases.innerHTML =
consultations.filter(
c => c.paid == 1
).length;

history.innerHTML = "";

if(
consultations.length === 0
){

history.innerHTML =

`

<div class="empty">

<h3>
No Consultation History
</h3>

<p>

Your consultation records
will appear here.

</p>

</div>

`;

return;

}

consultations.forEach(item=>{

let statusClass =
"pending";

if(
item.status === "In Review"
){

statusClass =
"review";

}

if(
item.status === "Completed"
){

statusClass =
"completed";

}

history.innerHTML +=

`

<div class="history-card">

<h2>

🦷 Case #${item.id}

</h2>

<br>

<p>

<b>Symptoms:</b>

<br><br>

${item.symptoms}

</p>

<br>

<p>

<b>Diagnosis:</b>

<br><br>

${item.diagnosis ||

"Awaiting Diagnosis"}

</p>

<br>

<span
class="badge ${statusClass}">

${item.status}

</span>

&nbsp;

<span class="badge
${item.paid == 1
? "paid"
: "unpaid"}">

${item.paid == 1
? "✅ Paid"
: "❌ Unpaid"}

</span>

${
item.photo_url

?

`

<br><br>

<img
class="photo"
src="${item.photo_url}">

`

:

""

}

<div class="actions">

<a href="
consultation-details.html?id=
${item.id}
">

<button
class="btn primary">

View Record

</button>

</a>

<a href="
messages.html?consultation=
${item.id}
">

<button
class="btn success">

Open Chat

</button>

</a>

</div>

</div>

`;

});

}

loadHistory();

</script>

</body>

</html>
