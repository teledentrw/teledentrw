<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
TeleDent Patient Registry
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f8fc;
}

.header{

background:
linear-gradient(
135deg,
#0a4d8c,
#1976d2
);

color:white;

padding:35px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 10px 25px rgba(0,0,0,.1);

}

.header h1{

font-size:32px;

margin-bottom:5px;

}

.container{

max-width:1400px;

margin:auto;

padding:25px;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.stat-card{

background:white;

padding:20px;

border-radius:20px;

box-shadow:
0 4px 20px rgba(0,0,0,.06);

}

.stat-card h3{

color:#0a4d8c;

margin-bottom:10px;

}

.search-section{

display:flex;

gap:15px;

margin-bottom:30px;

flex-wrap:wrap;

}

.search-section input{

flex:1;

padding:15px;

border:1px solid #ddd;

border-radius:12px;

font-size:16px;

}

.patient-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(330px,1fr));

gap:25px;

}

.patient-card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:
0 10px 30px rgba(0,0,0,.05);

transition:.3s;

}

.patient-card:hover{

transform:translateY(-5px);

}

.patient-header{

display:flex;

gap:15px;

align-items:center;

margin-bottom:15px;

}

.patient-avatar{

width:70px;

height:70px;

border-radius:50%;

background:#e8efff;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

}

.patient-name{

font-size:22px;

font-weight:bold;

color:#0a4d8c;

}

.patient-email{

color:#666;

font-size:14px;

}

.patient-info{

margin-top:15px;

line-height:1.9;

}

.patient-badge{

display:inline-block;

background:#e8f7ee;

color:#25c26e;

padding:6px 12px;

border-radius:30px;

font-size:14px;

font-weight:bold;

margin-top:10px;

}

.actions{

margin-top:20px;

display:flex;

gap:10px;

flex-wrap:wrap;

}

button{

border:none;

padding:12px 16px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.primary{

background:#0a4d8c;

color:white;

}

.success{

background:#25c26e;

color:white;

}

.empty{

background:white;

padding:50px;

border-radius:20px;

text-align:center;

}

@media(max-width:768px){

.header{

flex-direction:column;

gap:20px;

}

}

</style>

<link
rel="stylesheet"
href="mobile.css">

</head>

<body>
    <button
id="menuBtn">

☰

</button>

<div class="header">

<div>

<h1>

👥 Patient Registry

</h1>

<p>

Manage patient records and
clinical histories

</p>

</div>

<a href="dentist.html">

<button
class="primary">

← Dashboard

</button>

</a>

</div>

<div class="container">

<div class="stats">

<div class="stat-card">

<h3>

Total Patients

</h3>

<p id="totalPatients">

0

</p>

</div>

<div class="stat-card">

<h3>

Patient Records

</h3>

<p id="recordCount">

0

</p>

</div>

<div class="stat-card">

<h3>

Active Patients

</h3>

<p id="activePatients">

0

</p>

</div>

<div class="stat-card">

<h3>

TeleDent Coverage

</h3>

<p>

National

</p>

</div>

</div>

<div class="search-section">

<input
id="patientSearch"
placeholder="Search patient by name or email...">

</div>

<div
id="patientGrid"
class="patient-grid">

<div class="empty">

Loading patients...

</div>

</div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

let allPatients = [];

async function loadPatients(){

try{

const response =
await fetch(
API + "/patients"
);

const patients =
await response.json();

allPatients =
patients;

document.getElementById(
"totalPatients"
).innerHTML =
patients.length;

document.getElementById(
"recordCount"
).innerHTML =
patients.length;

document.getElementById(
"activePatients"
).innerHTML =
patients.length;

renderPatients(
patients
);

}
catch(error){

document.getElementById(
"patientGrid"
).innerHTML =

`
<div class="empty">

Failed to load patients

</div>
`;

}

}

function renderPatients(
patients
){

if(
patients.length === 0
){

document.getElementById(
"patientGrid"
).innerHTML =

`
<div class="empty">

No patients found

</div>
`;

return;

}

document.getElementById(
"patientGrid"
).innerHTML =

patients.map(patient => `

<div class="patient-card">

<div class="patient-header">

<div class="patient-avatar">

👤

</div>

<div>

<div class="patient-name">

${patient.fullname}

</div>

<div class="patient-email">

${patient.email}

</div>

</div>

</div>

<div class="patient-info">

<strong>ID:</strong>
${patient.id}

<br>

<strong>Phone:</strong>
${patient.phone || "Not provided"}

<br>

<strong>Gender:</strong>
${patient.gender || "Not specified"}

<br>

<span class="patient-badge">

✅ Registered Patient

</span>

</div>

<div class="actions">

<a href="
patient-record.html?id=${patient.id}
">

<button
class="primary">

Open Record

</button>

</a>

<a href="
messages.html?patient=${patient.id}
">

<button
class="success">

Message

</button>

</a>

</div>

</div>

`).join("");

}

document.getElementById(
"patientSearch"
).addEventListener(
"input",
function(){

const keyword =
this.value
.toLowerCase();

const filtered =
allPatients.filter(
patient =>

patient.fullname
.toLowerCase()
.includes(keyword)

||

patient.email
.toLowerCase()
.includes(keyword)

);

renderPatients(
filtered
);

}
);

loadPatients();

</script>

<script src="ai-widget.js"></script>

<script>

const menuBtn =
document.getElementById(
"menuBtn"
);

const sidebar =
document.querySelector(
".sidebar"
);

if(
menuBtn &&
sidebar
){

menuBtn.onclick = ()=>{

sidebar.classList.toggle(
"active"
);

};

}

</script>
</body>

</html>
