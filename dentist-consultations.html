<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TeleDent Consultations</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f8fc;
}

.header{

background:
linear-gradient(
135deg,
#0a4d8c,
#f5f5f5
);

color:white;
padding:35px;
border-radius:20px;
margin:20px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.header h1{
color:#f5f5f5;
}

.container{
max-width:1400px;
margin:auto;
padding:25px;
}

.toolbar{
display:flex;
gap:15px;
margin-bottom:25px;
flex-wrap:wrap;
}

.search-box{
flex:1;
min-width:250px;
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

.filter{
padding:15px;
border:1px solid #ddd;
border-radius:12px;
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-card{
background:rgb(254, 255, 254);
padding:15px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.stat-card h3{
color:#0a4d8c;
margin-bottom:10px;
}

.consultation-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
gap:25px;
}

.consultation-card{
background:rgb(250, 247, 247);
padding:15px;
height: 100%;
width: 100%;
border-radius:20px;
box-shadow:
0 8px 25px rgba(0,0,0,.06);
transition:.3s;
}
.consultation-card:hover{
transform:translateY(-5px);
}

.consultation-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.consultation-id{
font-size:22px;
font-weight:bold;
color:#0a4d8c;
}

.priority{
padding:8px 14px;
border-radius:30px;
font-weight:bold;
}

.urgent{
background:#ffe5e5;
color:#d10000;
}

.high{
background:#fff0d6;
color:#ff9800;
}

.normal{
background:#e6f6ea;
color:#25c26e;
}

.case-image{
width:100%;
height:120px;
object-fit:cover;
border-radius:15px;
margin-top:15px;
margin-bottom:15px;
}

.ai-box{
background:#fafaf9;
padding:15px;
border-left:4px solid #0a4d8c;
border-radius:10px;
margin-top:5px;
margin-bottom:5px;
}

.ai-box h4{
color:#0a4d8c;
margin-bottom:8px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
flex-wrap:wrap;
}

button{
border:none;
padding:12px 16px;
border-radius:10px;
cursor:pointer;
}

.primary{
background:#0a4d8c;
color:white;
}

.success{
background:#25c26e;
color:white;
}

.warning{
background:#ff9800;
color:white;
}

.modal-overlay{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
z-index:9999;
overflow:auto;
}

.appointment-modal{
background:white;
width:700px;
height:100%;
max-width:95%;
margin:15px auto;
border-radius:25px;
overflow:hidden;
box-shadow:
0 20px 40px rgba(0,0,0,.25);

}

.modal-header{

background:
linear-gradient(
135deg,
#0a4d8c,
#1976d2
);

color:white;
padding:15px;
display:flex;
align-items:center;
gap:20px;
}

.modal-content{
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

.modal-content input,
.modal-content textarea{
padding:15px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
}

.modal-content textarea{
height:80px;
resize:none;
}

.back-btn{
background:white;
color:#0a4d8c;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.save-btn{
background:#25c26e;
color:white;
border:none;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer
}

.save-btn:hover{
background:#1ea45d;

}

@media(max-width:768px){

.consultation-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<div>

<h1>
🦷 Clinical Consultations
</h1>

<p>
Review, diagnose and manage patient cases.
</p>

</div>

<div>

<a href="dentist.html">

<button class="primary">

← Dashboard

</button>

</a>

</div>

</div>

</a>

</div>

<div class="container">

<div class="stats">

<div class="stat-card">
<h3>Total Cases</h3>
<p id="totalCases">0</p>
</div>

<div class="stat-card">
<h3>Pending</h3>
<p id="pendingCases">0</p>
</div>

<div class="stat-card">
<h3>In Review</h3>
<p id="reviewCases">0</p>
</div>

<div class="stat-card">
<h3>Completed</h3>
<p id="completedCases">0</p>
</div>

</div>

<div class="toolbar">

<input
id="searchBox"
class="search-box"
placeholder="Search consultations...">

<select
id="statusFilter"
class="filter">

<option value="">
All Statuses
</option>

<option>
Pending
</option>

<option>
In Review
</option>

<option>
Completed
</option>

</select>

</div>

<div
id="consultationGrid"
class="consultation-grid">

Loading consultations...

</div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

function getPriority(symptoms){

const text =
(symptoms || "")
.toLowerCase();

if(
text.includes("swelling") ||
text.includes("infection")
){
return "urgent";
}

if(
text.includes("pain")
){
return "high";
}

return "normal";

}

let selectedConsultation =
null;

let selectedPatient =
null;

function scheduleAppointment(
consultationId,
patientId
){

selectedConsultation =
consultationId;

selectedPatient =
patientId;

document.getElementById(
"appointmentModal"
).style.display =
"flex";

}

function closeAppointmentModal(){

document.getElementById(
"appointmentModal"
).style.display =
"none";

}

async function saveAppointment(){

await fetch(
API +
"/create-appointment",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

consultation_id:
selectedConsultation,

patient_id:
selectedPatient,

dentist_id:
user.id,

appointment_date:
document.getElementById(
"appointmentDate"
).value,

clinic_name:
document.getElementById(
"clinicName"
).value,

clinic_address:
document.getElementById(
"clinicAddress"
).value

})
}
);

alert(
"✅ Appointment Successfully Scheduled"
);

closeAppointmentModal();

document.getElementById(
"appointmentModal"
).style.display =
"none";

}

async function loadConsultations(){

const response =
await fetch(
API + "/consultations"
);

const consultations =
await response.json();

document.getElementById(
"totalCases"
).innerHTML =
consultations.length;

document.getElementById(
"pendingCases"
).innerHTML =
consultations.filter(
c=>c.status==="Pending"
).length;

document.getElementById(
"reviewCases"
).innerHTML =
consultations.filter(
c=>c.status==="In Review"
).length;

document.getElementById(
"completedCases"
).innerHTML =
consultations.filter(
c=>c.status==="Completed"
).length;

document.getElementById(
"consultationGrid"
).innerHTML =

consultations.map(item=>{

const priority =
getPriority(item.symptoms);

return `

<div class="consultation-card">

<div class="consultation-header">

<div class="consultation-id">

Consultation #${item.id}

</div>

<div class="priority ${priority}">

${priority.toUpperCase()}

</div>

</div>

<p>

<b>Status:</b>
${item.status}

</p>

<br>

<p>

<b>Symptoms:</b>

${item.symptoms}

</p>

${
item.photo_url
?

`<img
src="${item.photo_url}"
class="case-image">`

:

""

}

<div class="ai-box">

<h4>
🤖 TeleDent AI
</h4>

Possible dental issue detected.

Review symptoms and
patient photos before diagnosis.

</div>

<div class="actions">

<a
href="consultation-details.html?id=${item.id}">

<button class="primary">

<a href="patient-record.html?id=${item.patient_id}">

<button class="primary">

Patient Record

</button>

</a>

</button>

</a>

<a
href="messages.html?consultation=${item.id}">

<button class="success">

Reply

</button>

</a>

<button
class="warning"
onclick="
scheduleAppointment(
${item.id},
${item.patient_id}
)
">

Schedule Appointment

</button>

</div>

</div>

`;

}).join("");

}

loadConsultations();

</script>

<script src="ai-widget.js"></script>

<div
id="appointmentModal"
class="modal-overlay">

<div
class="appointment-modal">

<div class="modal-header">

<button
class="back-btn"
onclick="closeAppointmentModal()">

← Back

</button>

<h2>

📅 Schedule Appointment

</h2>

</div>

<div class="modal-content">

<label>

Appointment Date

</label>

<input
type="date"
id="appointmentDate">

<label>

Clinic Name

</label>

<input
id="clinicName"
placeholder="TeleDent Dental Clinic">

<label>

Clinic Address

</label>

<input
id="clinicAddress"
placeholder="Kigali, Rwanda">

<label>

Additional Notes

</label>

<textarea
id="appointmentNotes"
placeholder="Optional notes for patient">
</textarea>

<button
class="save-btn"
onclick="saveAppointment()">

✅ Schedule Appointment

</button>

</div>

</div>

</div>

<input
type="date"
id="appointmentDate">

<br><br>

<input
id="clinicName"
placeholder="Clinic Name">

<br><br>

<input
id="clinicAddress"
placeholder="Clinic Address">

<br><br>

<button
onclick="saveAppointment()">

Save Appointment

</button>

</div>

</div>

</body>
</html>
