<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>New Consultation</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f9fc;
}

.container{
max-width:900px;
margin:40px auto;
padding:20px;
}

.header{
background:white;
padding:25px;
border-radius:12px;
margin-bottom:20px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.steps{
display:flex;
justify-content:space-between;
margin-bottom:25px;
}

.step{
flex:1;
text-align:center;
padding:15px;
background:white;
margin:5px;
border-radius:10px;
font-weight:bold;
}

.active{
background:#0a4d8c;
color:white;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

textarea{
width:100%;
height:180px;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
}

input[type=file]{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:20px;
}

.preview{
margin-top:20px;
}

.preview img{
max-width:300px;
border-radius:10px;
border:1px solid #ddd;
}

.btn{
background:#25c26e;
color:white;
border:none;
padding:15px 25px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

.review{
background:#eef5fb;
padding:15px;
border-radius:10px;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
🦷 New Dental Consultation
</h1>

<p>
Describe your dental concern and upload a photo for professional review.
</p>

</div>

<div class="steps">

<div class="step active">
1. Symptoms
</div>

<div class="step">
2. Photo
</div>

<div class="step">
3. Review
</div>

<div class="step">
4. Submit
</div>

</div>

<div class="card">

<h3>
Describe Your Symptoms
</h3>

<textarea
id="symptoms"
placeholder="
Example:
I have severe pain in my upper left tooth.
The pain started three days ago and worsens when eating hot food.
"></textarea>

<h3>
Upload Dental Photo
</h3>

<input
type="file"
id="photo"
accept="image/*">

<div
class="preview">

<img
id="preview"
style="display:none;">

</div>

<div
id="review"
class="review"
style="display:none;">

<h4>
Review Consultation
</h4>

<p id="reviewSymptoms"></p>

</div>

<br>

<button
class="btn"
onclick="submitConsultation()">

Submit Consultation

</button>

</div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

const user =
JSON.parse(
localStorage.getItem("user")
);

photo.onchange = () => {

const file =
photo.files[0];

if(!file)
return;

preview.src =
URL.createObjectURL(file);

preview.style.display =
"block";

review.style.display =
"block";

reviewSymptoms.innerText =
symptoms.value;

};

async function submitConsultation(){

let photoUrl = "";

if(photo.files.length){

const fd =
new FormData();

fd.append(
"file",
photo.files[0]
);

const upload =
await fetch(
API + "/upload-photo",
{
method:"POST",
body:fd
}
);

const uploadData =
await upload.json();

photoUrl =
"https://pub-d893af81bd0f4eeead94f13b98e040d7.r2.dev/" +
uploadData.fileName;

}

const res =
await fetch(
API + "/consultation",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({

patient_id:user.id,

symptoms:
symptoms.value,

photo_url:
photoUrl

})
}
);

const data =
await res.json();

if(data.success){

alert(
"Consultation Submitted Successfully"
);

location =
"patient.html";

}

}

</script>

</body>

</html>
