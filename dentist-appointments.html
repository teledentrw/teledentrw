<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
Dentist Appointments
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
background:#f4f8fc;
}

.header{

background:
linear-gradient(
135deg,
#0a4d8c,
#1976d2
);

color:white;

padding:30px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

.back-button{

background:white;

color:#0a4d8c;

padding:12px 20px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.container{

max-width:1400px;

margin:auto;

padding:25px;

}

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:25px;

}

.stat-card{

background:white;

padding:20px;

border-radius:18px;

box-shadow:
0 5px 15px rgba(0,0,0,.05);

}

.stat-card h3{

color:#0a4d8c;

margin-bottom:10px;

}

.toolbar{

display:flex;

gap:15px;

margin-bottom:25px;

flex-wrap:wrap;

}

.toolbar input,
.toolbar select{

padding:14px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

}

.toolbar input{

flex:1;

}

.appointments-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(420px,1fr));

gap:25px;

}

.appointment-card{

background:white;

padding:25px;

border-radius:20px;

box-shadow:
0 5px 20px rgba(0,0,0,.05);

transition:.3s;

}

.appointment-card:hover{

transform:translateY(-4px);

}

.card-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:15px;

}

.badge{

padding:8px 14px;

border-radius:20px;

font-weight:bold;

}

.upcoming{

background:#e8f1ff;

color:#0a4d8c;

}

.completed{

background:#e8f7ee;

color:#25c26e;

}

.missed{

background:#ffe5e5;

color:#d90000;

}

.detail{

margin-bottom:10px;

line-height:1.7;

}

.ai-box{

background:#eef7ff;

padding:15px;

border-left:4px solid #0a4d8c;

border-radius:10px;

margin-top:15px;

}

.ai-box h4{

color:#0a4d8c;

margin-bottom:8px;

}

.actions{

display:flex;

gap:10px;

margin-top:20px;

flex-wrap:wrap;

}

button{

border:none;

padding:12px 16px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

.primary{

background:#0a4d8c;

color:white;

}

.success{

background:#25c26e;

color:white;

}

.warning{

background:#ff9800;

color:white;

}

@media(max-width:768px){

.appointments-grid{

grid-template-columns:1fr;

}

.header{

flex-direction:column;

gap:15px;

text-align:center;

}

}

</style>

<link
rel="stylesheet"
href="mobile.css">

</head>

<body>

<div class="header">

<div>

<h1>
📅 Dentist Appointment Center
</h1>

<p>
Manage patient appointments and treatment schedules
</p>

</div>

<a href="dentist.html">

<button class="back-button">

← Dashboard

</button>

</a>

</div>

<div class="container">

<div class="stats">

<div class="stat-card">

<h3>
Today's Appointments
</h3>

<p id="todayCount">
0
</p>

</div>

<div class="stat-card">

<h3>
Upcoming
</h3>

<p id="upcomingCount">
0
</p>

</div>
