<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>My Appointments</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f5f9fc;
}

.container{
max-width:1300px;
margin:auto;
padding:25px;
}

.header{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.summary{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:12px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.big-number{
font-size:32px;
font-weight:bold;
color:#0a4d8c;
}

.appointment-card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:
0 2px 10px rgba(0,0,0,.05);
}

.badge{
display:inline-block;
padding:6px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
margin-top:10px;
}

.scheduled{
background:#eaf6ff;
color:#0a4d8c;
}

.completed{
background:#eafaf1;
color:#25c26e;
}

.cancelled{
background:#ffe8e8;
color:#f44336;
}

.info{
margin-top:10px;
line-height:1.8;
}

.btn{
background:#0a4d8c;
color:white;
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.empty{
text-align:center;
padding:40px;
color:#666;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
📅 My Appointments
</h1>

<p>
Manage upcoming consultations and clinic visits.
</p>

</div>

<div class="summary">

<div class="card">

<h3>
Upcoming Appointments
</h3>

<div
class="big-number"
id="appointmentCount">

0

</div>

</div>

<div class="card">

<h3>
Next Visit
</h3>

<div id="nextVisit">

None Scheduled

</div>

</div>

</div>

<div id="appointments"></div>

</div>

<script>

const API =
"https://teledentalrwanda.sangoblaise51.workers.dev";

const user =
JSON.parse(
localStorage.getItem("user")
);

if(!user){

location =
"login.html";

}

async function loadAppointments(){

const res =
await fetch(
API + "/appointments"
);

const data =
await res.json();

const myAppointments =
data.filter(
a => a.patient_id == user.id
);

appointmentCount.innerHTML =
myAppointments.length;

if(myAppointments.length){

nextVisit.innerHTML =
myAppointments[0]
.appointment_date;

}

appointments.innerHTML = "";

if(
myAppointments.length === 0
){

appointments.innerHTML =

`

<div class="card empty">

<h3>
📅 No Appointments Yet
</h3>

<p>

Your scheduled visits will appear here.

</p>

</div>

`;

return;

}

myAppointments.forEach(item=>{

appointments.innerHTML +=

`

<div class="appointment-card">

<h2>

🦷 Appointment #${item.id}

</h2>

<div class="info">

<b>Date:</b>

${item.appointment_date}

<br>

<b>Clinic:</b>

${item.clinic_name}

<br>

<b>Address:</b>

${item.clinic_address}

</div>

<div class="badge scheduled">

${item.status}

</div>

<br>

<button
class="btn">

View Details

</button>

</div>

`;

});

}

loadAppointments();

</script>

</body>

</html>
